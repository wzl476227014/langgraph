# 安全运营报告专用Prompts配置
# 基于abc_supply_chain_security_report样式优化

report_generation:
  system_prompt: |
    你是一位专业的安全运营分析专家，专门为企业管理层生成高质量的安全运营报告。
    你需要参考专业的供应链安全报告格式，生成结构清晰、数据准确、图表丰富的PPT报告。
    
    报告特点要求：
    1. 数据驱动：使用精确的数字和百分比，展示安全态势
    2. 可视化展示：通过图表直观展示安全数据
    3. 专业术语：使用安全行业标准术语
    4. 管理视角：从管理层关注的角度组织内容
    5. 风险导向：突出风险点和改进建议

slide_templates:
  cover:
    prompt: |
      生成专业的安全运营报告封面页，包含以下要素：
      
      标题格式：
      - 主标题：XXX公司安全运营分析报告
      - 副标题：安全态势评估与改进建议
      - 时间：YYYY年MM月
      - 报告单位：安全运营中心
      
      设计要求：
      - 使用深蓝色渐变背景（#0a1426到#2a5298）
      - 包含安全防护图标元素
      - 专业商务风格
      - 突出数据安全主题
      
  executive_summary:
    prompt: |
      生成执行摘要页面，包含以下核心指标：
      
      安全评分：
      - 综合安全评分：84.14分
      - 同比增长：+12.5%
      - 行业排名：前15%
      
      关键发现：
      1. 威胁态势：
         - 拦截攻击次数：151.8万次
         - 成功防御率：99.2%
         - 高危威胁：23起
      
      2. 资产保护：
         - 关键资产覆盖率：93%
         - 数据泄露风险：低
         - 业务连续性：99.9%
      
      3. 合规状态：
         - 合规度：87%
         - 待整改项：12个
         - 整改进度：78%
      
  threat_analysis:
    prompt: |
      生成威胁分析页面，包含以下内容：
      
      威胁概览：
      1. 攻击类型分布：
         - Web攻击：45%（68.3万次）
         - 恶意扫描：28%（42.5万次）
         - DDoS攻击：15%（22.8万次）
         - 钓鱼邮件：8%（12.1万次）
         - 其他：4%（6.1万次）
      
      2. 攻击趋势分析：
         - 月度攻击峰值：3月（28.6万次）
         - 攻击增长率：环比+15%
         - 高危时段：工作日9-11点，14-16点
      
      3. 威胁源分析：
         - 境外攻击：62%
         - 境内攻击：38%
         - TOP5攻击源国家/地区
      
      防护效果：
      - 实时拦截率：99.2%
      - 平均响应时间：<100ms
      - 误报率：<1%
      
  vulnerability_management:
    prompt: |
      生成漏洞管理页面，包含以下内容：
      
      漏洞统计：
      1. 漏洞分级：
         - 紧急：12个（已修复10个）
         - 高危：45个（已修复38个）
         - 中危：132个（已修复98个）
         - 低危：267个（已修复180个）
      
      2. 修复进度：
         - 总体修复率：71.5%
         - 紧急漏洞修复率：83.3%
         - 高危漏洞修复率：84.4%
         - 平均修复时长：7.2天
      
      3. 漏洞类型分布：
         - 应用漏洞：35%
         - 系统漏洞：28%
         - 配置缺陷：20%
         - 组件漏洞：12%
         - 其他：5%
      
      改进建议：
      - 建立漏洞修复SLA
      - 加强漏洞扫描频率
      - 优化修复流程
      
  asset_security:
    prompt: |
      生成资产安全页面，包含以下内容：
      
      资产概览：
      1. 资产统计：
         - 服务器：356台
         - 网络设备：128台
         - 安全设备：45台
         - 业务系统：89个
         - 数据库：67个
      
      2. 资产安全状态：
         - 在线率：97.8%
         - 已纳管：93%
         - 安全基线合规：85%
         - 补丁覆盖率：88%
      
      3. 关键资产保护：
         - 核心系统：100%覆盖
         - 敏感数据：加密存储
         - 备份完整性：99.5%
         - 灾备演练：季度执行
      
      风险点：
      - 7%资产未纳入管理
      - 15%设备基线不合规
      - 部分老旧设备待更新
      
  incident_response:
    prompt: |
      生成安全事件响应页面，包含以下内容：
      
      事件统计：
      1. 事件分级：
         - 紧急事件：2起（100%闭环）
         - 高危事件：15起（93%闭环）
         - 中危事件：68起（88%闭环）
         - 低危事件：234起（82%闭环）
      
      2. 响应效率：
         - 平均响应时间：15分钟
         - 平均处置时间：2.5小时
         - 闭环率：85.3%
         - 误报率：8%
      
      3. 事件类型：
         - 恶意软件：28%
         - 账号异常：22%
         - 数据泄露：15%
         - 权限滥用：13%
         - 其他：22%
      
      典型案例：
      - 3月：成功阻止勒索病毒攻击
      - 4月：快速响应数据泄露风险
      - 5月：及时发现APT攻击迹象
      
  compliance_status:
    prompt: |
      生成合规状态页面，包含以下内容：
      
      合规概览：
      1. 法规遵从：
         - 网络安全法：92%
         - 数据安全法：88%
         - 个人信息保护法：85%
         - 行业标准：90%
      
      2. 认证状态：
         - ISO27001：已通过
         - 等保三级：已认证
         - SOC2：进行中
         - PCI-DSS：计划中
      
      3. 审计发现：
         - 总发现项：45个
         - 已整改：33个
         - 整改中：8个
         - 待整改：4个
      
      合规风险：
      - 个人信息保护需加强
      - 数据分类分级待完善
      - 访问控制策略需优化
      
  recommendations:
    prompt: |
      生成改进建议页面，包含以下内容：
      
      优先级建议：
      
      🔴 紧急（1个月内）：
      1. 修复所有紧急和高危漏洞
      2. 完善数据分类分级体系
      3. 加强个人信息保护措施
      
      🟡 重要（3个月内）：
      1. 提升资产纳管率至98%
      2. 优化安全事件响应流程
      3. 建立威胁情报共享机制
      4. 完善安全运营指标体系
      
      🟢 建议（6个月内）：
      1. 引入AI安全分析能力
      2. 建立安全运营中心（SOC）
      3. 开展红蓝对抗演练
      4. 提升安全自动化水平
      
      预期效果：
      - 安全评分提升至90分以上
      - 事件响应时间缩短50%
      - 漏洞修复率提升至85%
      - 合规度达到95%

chart_configurations:
  security_score:
    type: radar
    title: 安全能力成熟度雷达图
    dimensions:
      - 威胁防护: 85
      - 漏洞管理: 78
      - 资产管理: 82
      - 事件响应: 88
      - 合规管理: 87
      - 数据保护: 83
      
  attack_trend:
    type: line
    title: 攻击趋势图
    x_axis: 月份
    y_axis: 攻击次数（万）
    data_points: 12
    
  vulnerability_status:
    type: stacked_bar
    title: 漏洞状态分布
    categories:
      - 已修复
      - 修复中
      - 待修复
    levels:
      - 紧急
      - 高危
      - 中危
      - 低危
      
  incident_pie:
    type: pie
    title: 安全事件类型分布
    show_percentage: true
    show_legend: true

style_guidelines:
  color_scheme:
    primary: "#2a5298"      # 主色-深蓝
    secondary: "#1e3c72"    # 辅色-海军蓝
    accent: "#78c7ff"       # 强调色-亮蓝
    success: "#27ae60"      # 成功-绿色
    warning: "#f39c12"      # 警告-橙色
    danger: "#e74c3c"       # 危险-红色
    background: "#0a1426"   # 背景-深色
    text: "#ffffff"         # 文字-白色
    
  typography:
    title_size: 36
    subtitle_size: 24
    heading_size: 20
    body_size: 14
    caption_size: 12
    
  layout:
    margin: 60
    padding: 40
    chart_height: 400
    chart_width: 600