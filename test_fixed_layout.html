<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>修复后的布局测试</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .slide-container { width: 1920px; height: 1080px; background-color: white; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .page-number { position: absolute; bottom: 30px; right: 50px; font-size: 14px; color: #666; }
  .primary-color { color: rgb(10, 66, 117); }
  .primary-bg { background-color: rgb(10, 66, 117); }
  .top-bar { height: 10px; width: 100%; background-color: rgb(10, 66, 117); }
  h1 { font-size: 48px; font-weight: 700; color: rgb(10, 66, 117); margin-bottom: 20px; }
  h2 { font-size: 36px; font-weight: 600; color: rgb(10, 66, 117); margin-bottom: 15px; }
  h3 { font-size: 28px; font-weight: 600; color: rgb(10, 66, 117); }
  p { font-size: 25px; color: #333; line-height: 1.6; }
  .data-card { border-left: 4px solid rgb(10, 66, 117); padding: 15px 20px; background-color: rgba(10, 66, 117, 0.03); border-radius: 8px; margin-bottom: 20px; }
  .stat-card { background-color: rgba(10, 66, 117, 0.08); border-radius: 8px; padding: 15px 20px; border-left: 4px solid rgb(10, 66, 117); margin-bottom: 20px; }
  
  /* 修复后的样式 */
  .chart-container { margin-bottom: 20px; position: relative; }
  .chart-container h3 { font-size: 28px; color: rgb(10, 66, 117); margin-bottom: 10px; }
  
  /* 内容区域优化 - 允许滚动 */
  .content-section { flex: 1; padding: 40px 80px 60px 80px; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
  .content-section > div:last-of-type { padding-bottom: 20px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<div class="slide-container">
  <div class="top-bar"></div>
  <div class="content-section">
    <!-- 标题区域 -->
    <div class="mb-6">
      <h1>业务连续性保障与系统稳定运行</h1>
      <h2 class="text-gray-600">系统稳定性与防护成效</h2>
      <div class="w-20 h-1 primary-bg"></div>
    </div>

    <!-- 内容区域 -->
    <div class="flex-1">
      <p style="margin-bottom: 20px;">通过全面的安全防护体系，实现核心业务系统全年零中断、零损失，保障政府服务持续可用。</p>
      
      <!-- 图表 -->
      <div class="chart-container">
        <h3>业务可用率</h3>
        <div id="gauge-chart" style="width: 100%; height: 350px;"></div>
      </div>
      
      <!-- 关键指标 -->
      <div style="margin-top: 30px;">
        <h3 style="margin-bottom: 15px;">关键指标达成情况</h3>
        <div class="grid grid-cols-2 gap-6">
          <div class="stat-card">
            <p class="text-32px font-bold" style="font-size: 32px; font-weight: bold;">100%</p>
            <p>业务系统运行稳定性</p>
          </div>
          <div class="stat-card">
            <p class="text-32px font-bold" style="font-size: 32px; font-weight: bold;">0</p>
            <p>服务中断事件数</p>
          </div>
          <div class="stat-card">
            <p class="text-32px font-bold" style="font-size: 32px; font-weight: bold;">0</p>
            <p>业务安全损失事件</p>
          </div>
          <div class="stat-card">
            <p class="text-32px font-bold" style="font-size: 32px; font-weight: bold;">已关闭</p>
            <p>高危端口关闭情况</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="page-number">4</div>
</div>

<script>
// 初始化仪表盘
(function() {
    var chartDom = document.getElementById('gauge-chart');
    var myChart = echarts.init(chartDom);
    var option = {
      series: [{
        type: 'gauge',
        startAngle: 180,
        endAngle: 0,
        center: ['50%', '70%'],
        radius: '90%',
        min: 0,
        max: 100,
        splitNumber: 8,
        axisLine: {
          lineStyle: {
            width: 15,
            color: [[0.3, '#91cc75'], [0.7, 'rgb(10, 66, 117)'], [1, '#ee6666']]
          }
        },
        pointer: { itemStyle: { color: 'auto' } },
        axisTick: { distance: -15, length: 8, lineStyle: { color: '#fff', width: 2 } },
        splitLine: { distance: -20, length: 15, lineStyle: { color: '#fff', width: 3 } },
        axisLabel: { color: 'auto', distance: 25, fontSize: 14 },
        detail: {
          valueAnimation: true,
          formatter: '{value}%',
          color: 'rgb(10, 66, 117)',
          fontSize: 32,
          offsetCenter: [0, '0%']
        },
        data: [{ value: 100, name: '' }]
      }]
    };
    myChart.setOption(option);
    window.addEventListener('resize', function() { myChart.resize(); });
})();
</script>
</body>
</html>
